name: Lint Check

on:
  push:
    branches:
      - Develop
  pull_request:
    branches:
      - Develop
jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install cppcheck as a dependency using a separate 'run' step
      - name: Install Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run Cppcheck linting script
        run: |
          cd scripts/
          ./lint.sh
